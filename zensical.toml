[project]
site_name = "Confluent"
site_author = "Confluent Community"
site_url = "https://xcat2.github.io/confluent-docs/"
site_description = "Confluent documentation"
repo_name = "xcat2/confluent-docs"
repo_url = "https://github.com/xcat2/confluent-docs"
edit_uri = "edit/master/docs/"
copyright = "Copyright &copy; Confluent Community"
site_dir = "_site"
extra_css = ["stylesheets/diagrams.css"]

[project.validation]
invalid_links = true
invalid_link_anchors = true

[project.theme]
variant = "modern"
language = "en"
favicon = "assets/icon.svg"
logo = "assets/icon.svg"
features = [
  "content.action.copy",
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.tracking",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.sections",
  "navigation.indexes",
  "navigation.path",
  # Smaller HTML (about 40%), but other sections become plain links in the mobile menu.
  # "navigation.prune",
  "navigation.top",
  "navigation.footer",
  "search.highlight",
  "search.share",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "blue"
accent = "blue"

[project.theme.palette.toggle]
icon = "material/brightness-auto"
name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "blue"
accent = "blue"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "blue"
accent = "blue"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/xcat2/confluent"
name = "Confluent on GitHub"

[project.markdown_extensions.abbr]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.def_list]

[project.markdown_extensions.footnotes]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.tables]

[project.markdown_extensions."pymdownx.betterem"]
smart_enable = "all"

[project.markdown_extensions."pymdownx.blocks.caption"]

[project.markdown_extensions."pymdownx.caret"]

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.emoji"]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions."pymdownx.highlight"]

[project.markdown_extensions."pymdownx.inlinehilite"]

[project.markdown_extensions."pymdownx.keys"]

[project.markdown_extensions."pymdownx.mark"]

[project.markdown_extensions."pymdownx.smartsymbols"]
fractions = false

[project.markdown_extensions."pymdownx.snippets"]

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [{ name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.markdown_extensions."pymdownx.tasklist"]
custom_checkbox = true

[project.markdown_extensions."pymdownx.tilde"]

# Unsupported plugins:
# document-dates: page creation/update dates are omitted.
# Revisit support: https://zensical.org/docs/compatibility/mkdocs/plugins/
[project.plugins]

[project.plugins.search]

[project.plugins.privacy]

[project.plugins.tags]

[project.plugins.meta]

[project.plugins.blog]
blog_dir = "release_notes"
blog_toc = true

[project.plugins.rss]
match_path = "release_notes/posts/.*"

[project.plugins.rss.date_from_meta]
as_creation = "date"

[project.plugins.social]
enabled = true

[project.plugins.glightbox]

[project.plugins.awesome-nav]

[project.plugins.minify]
minify_html = true

[project.plugins.llmstxt]
full_output = "llms-full.txt"

[project.plugins.llmstxt.sections]
"Home" = ["index.md", "downloads.md"]
"Getting Started" = ["getting_started/*.md"]
"User Reference" = ["user_reference/*.md"]
"Advanced Topics" = ["advanced_topics/*.md"]
"Miscellaneous" = ["miscellaneous/*.md"]
"Manuals" = ["manuals/*.md"]
"Troubleshooting" = ["troubleshooting/*.md"]

[project.plugins.redirects.redirect_maps]
"developer/api.md" = "miscellaneous/api.md"
"miscellaneous/doca2-10-intstall.md" = "miscellaneous/doca2-10-install.md"
"advanced_topics/rh8installib.md" = "archive/ibinstallxcat.md"
"advanced_topics/sle152ibinstall.md" = "archive/ibinstallxcat.md"
