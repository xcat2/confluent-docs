name: build
on:
  push:
    branches:
      - master
      - main
  pull_request:
permissions:
  contents: write
jobs:
  build_and_deploy:
    name: Build and Deploy Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Configure Git Credentials
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Install Zensical requirements
        run: pip install -r requirements.txt
      - name: Install man-page renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends --no-install-suggests pandoc
      - name: Unlink confluent symlink
        run: unlink confluent
      - name: Checkout confluent repository for nodeattrib and man pages
        uses: actions/checkout@v7
        with:
          repository: xcat2/confluent
          path: confluent
      - name: Make nodeattrib document
        run: python3 makeattribdoc
      - name: Make man pages
        run: bash makeman
      - name: Build documentation
        run: zensical build --clean --strict
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        run: ghp-import --no-jekyll --push --force --branch gh-pages _site
