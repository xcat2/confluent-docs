name: build
on:
  push:
    branches:
      - master
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The RSS plugin takes post update dates from Git history.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Install Zensical requirements
        run: pip install -r requirements.txt
      - name: Install man-page renderer
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends --no-install-suggests pandoc
      - name: Unlink confluent symlink
        run: unlink confluent
      - name: Checkout confluent repository for nodeattrib and man pages
        uses: actions/checkout@v7
        with:
          repository: xcat2/confluent
          path: confluent
      - name: Make nodeattrib document
        run: python3 makeattribdoc
      - name: Make man pages
        run: bash makeman
      - name: Build documentation
        run: zensical build --clean --strict
      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
